name = "Mica"
persona = "./persona.example.md"
state = "./state"
workspace = "./workspace"
port = 3082

# A one-time already-compacted physical v0 or logical v3 DSH log can be inspected or imported with:
# pnpm --filter @lamplitisles/partner cli import-session /path/to/partner.toml /path/to/session.jsonl /path/to/.dsh/dsh-companion/state.jsonl /path/to/attachments/v1 /path/to/new-workspace /path/to/dsh/settings.yaml --dry-run
# Every source and destination path is explicit. The destination must be new or empty; every source remains unchanged.

# Avatar files must live inside workspace. The importer extracts these two
# files from dsh-companion in the supplied DSH settings YAML.
[avatars]
companion = "./workspace/.lamplit/profile/companion-avatar.png"
user = "./workspace/.lamplit/profile/user-avatar.png"

[codex]
command = "codex"
model = "gpt-5.6-luna"
version = "0.154.0"
# For the customized build, replace command above with its absolute codex path:
# provenance = "/absolute/path/to/artifact/codex.provenance.json"
# local_compaction = true
# home = "/path/to/a/Codex-home" # omit to use the existing Codex login

# Optional DashScope STT and tagged TTS; write the DashScope API key using `credential ... speech`.
# [speech]
# endpoint = "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
# [speech.tts]
# provider = "alibaba" # or "bytedance" (uses the separate `tts` credential)
# endpoint = "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
# model = "qwen3-tts-flash"
# voice = "Cherry"
