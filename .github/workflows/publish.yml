name: Publish CFL npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'LamplitIsles/codex-for-love'
    concurrency:
      group: npm-publish-codex-for-love
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.11.0'
          package-manager-cache: false
      - name: Require a strict tag on reviewed main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git tag --points-at "$GITHUB_SHA" | grep -Fx "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/release-shared.mjs "$RELEASE_TAG" >/dev/null
      - name: Verify the exact published native package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-preflight.mjs "$RELEASE_TAG"
      - name: Create disposable tag-authoritative release source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          stage="$GITHUB_WORKSPACE/cfl-release-source"
          mkdir -p "$stage"
          git archive "$GITHUB_SHA" | tar -x -C "$stage"
          node scripts/release-stage.mjs "$stage" "$RELEASE_TAG"
      - name: Read recorded App source
        id: app
        run: node --input-type=module -e 'import {readPin} from "./scripts/shared-source.mjs"; console.log("sha=" + await readPin())' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: LamplitIsles/lamplit-app
          ref: ${{ steps.app.outputs.sha }}
          path: lamplit-app
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned toolchain and dependencies
        working-directory: ${{ github.workspace }}/cfl-release-source
        run: |
          npm install --global npm@11.17.0 corepack@0.35.0
          corepack enable
          CFL_SOURCE_SHA="$GITHUB_SHA" corepack pnpm source:prepare --strict
          corepack pnpm install --frozen-lockfile
      - name: Typecheck, build, and test CFL
        working-directory: ${{ github.workspace }}/cfl-release-source
        run: |
          corepack pnpm check
          corepack pnpm build
          corepack pnpm test
      - name: Build, inspect, and pack the staged main package
        working-directory: ${{ github.workspace }}/cfl-release-source
        run: |
          mkdir -p "$RUNNER_TEMP/cfl-npm-release"
          CFL_SOURCE_SHA="$GITHUB_SHA" node scripts/release-prepare.mjs "$RUNNER_TEMP/cfl-npm-release" --strict
          node scripts/pack-check.mjs
      - name: Smoke the packed main package with the published native package
        timeout-minutes: 3
        working-directory: ${{ github.workspace }}/cfl-release-source
        env:
          CFL_ARTIFACT_DIR: ${{ runner.temp }}/cfl-npm-release
        run: node scripts/artifact-smoke.mjs
      - name: Verify immutable tarball and registry state
        id: preflight
        working-directory: ${{ github.workspace }}/cfl-release-source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          artifacts=("$RUNNER_TEMP/cfl-npm-release/"*.tgz)
          test "${#artifacts[@]}" -eq 1
          node scripts/publish-preflight.mjs "$RELEASE_TAG" "${artifacts[0]}"
      - name: Publish verified tarball using OIDC
        if: steps.preflight.outputs.skip != 'true'
        env:
          NPM_CHANNEL: ${{ steps.preflight.outputs.channel }}
        run: |
          shopt -s nullglob
          artifacts=("$RUNNER_TEMP/cfl-npm-release/"*.tgz)
          test "${#artifacts[@]}" -eq 1
          npm publish "${artifacts[0]}" --registry=https://registry.npmjs.org --access public --tag "$NPM_CHANNEL" --provenance
