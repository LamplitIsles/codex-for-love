name: Check source application
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-for-love
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: codex-for-love
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.11.0'
          package-manager-cache: false
      - name: Prepare published contracts and verify CFL in order
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack pnpm --config.verify-deps-before-run=false source:prepare --strict
          corepack pnpm install --frozen-lockfile
          corepack pnpm check
          corepack pnpm build
          corepack pnpm test
      - name: Verify optional package with fake engine and selected test frontend
        run: |
          mkdir -p "$RUNNER_TEMP/cfl-artifacts"
          corepack pnpm release:prepare "$RUNNER_TEMP/cfl-artifacts" --strict
          corepack pnpm release:check
          node scripts/packaged-frontend-smoke.mjs "$RUNNER_TEMP/cfl-artifacts/lamplitisles-codex-for-love-0.1.0-beta.0.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cfl-runtime-package
          path: ${{ runner.temp }}/cfl-artifacts/*.tgz
          if-no-files-found: error
