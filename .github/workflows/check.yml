name: Check source application
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-for-love
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: codex-for-love
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.11.0'
          package-manager-cache: false
      - name: Read recorded App source
        id: app
        run: node --input-type=module -e 'import {readPin} from "./scripts/shared-source.mjs"; console.log("sha=" + await readPin())' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: LamplitIsles/lamplit-app
          ref: ${{ steps.app.outputs.sha }}
          path: lamplit-app
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Prepare App and verify CFL in order
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack pnpm source:prepare --strict
          corepack pnpm install --frozen-lockfile
          corepack pnpm check
          corepack pnpm build
          corepack pnpm test
      - name: Package and verify complete application with fake engine
        run: |
          mkdir -p "$RUNNER_TEMP/cfl-artifacts"
          corepack pnpm release:prepare "$RUNNER_TEMP/cfl-artifacts" --strict
          corepack pnpm release:check
          node scripts/packaged-frontend-smoke.mjs "$RUNNER_TEMP/cfl-artifacts/lamplitisles-codex-for-love-0.1.0-beta.0.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-cfl-application
          path: ${{ runner.temp }}/cfl-artifacts/*.tgz
          if-no-files-found: error
